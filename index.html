function setL(l){d.lang=l;d.dir=l=='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(function(e){e.innerHTML=e.dataset[l]});lg.textContent=l=='ar'?'EN':'\u0639\u0631\u0628\u064a';document.title=l=='ar'?'\u0623\u0648\u0628\u0627 \u0633\u062a\u0648\u0631 | OPA Store':'OPA Store | Phones, Cash & Payments';ss('opa-lang',l)}
